<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVER ALL MUSIC</title>
<meta name="apple-mobile-web-app-title" content="OVER ALL MUSIC">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#e8f1f5;color:#172e3a;font-family:system-ui,sans-serif}main{width:100%;max-width:420px;padding:32px 24px;background:white;border-radius:24px;text-align:center}img{width:96px;height:96px;border-radius:20px}h1{font-size:24px}p{color:#567080;line-height:1.8;font-size:14px}a{display:block;margin-top:24px;padding:16px;border-radius:12px;background:#295d75;color:white;text-decoration:none;font-weight:bold}a[hidden]{display:none}
</style>
</head>
<body>
<main>
<img src="./apple-touch-icon.png" alt="OVER ALL MUSIC">
<h1>OVER ALL MUSIC</h1>
<p id="status" role="status">Safariの共有メニューから「ホーム画面に追加」してください。<br>「Webアプリとして開く」が表示された場合はオンにしてください。</p>
<a id="open" hidden>システムを開く</a>
<noscript><p>システムを開くにはJavaScriptを有効にしてください。</p></noscript>
</main>
<script>
// 部員向けの正式なWebアプリURL（末尾 /exec）を入力してください。
const APP_URL = 'https://script.google.com/a/rikkyo.ac.jp/macros/s/AKfycbyB8RMIYsQKTAb6tYbC3L7GqOqIECJdswHHhVu1GiHwebzvgrpk2LxUdKa6PYxFf3vC/exec';
const statusText = document.getElementById('status');
const openLink = document.getElementById('open');
let valid = false;
try {
  const url = new URL(APP_URL);
  valid = url.protocol === 'https:' && url.hostname === 'script.google.com'
    && /\/exec$/.test(url.pathname);
} catch (_) {}
if (!valid) {
  statusText.textContent = '入口ページの設定が未完了です。管理者はindex.htmlのAPP_URLを設定してください。';
} else {
  openLink.href = APP_URL;
  openLink.hidden = false;
  const standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) {
    statusText.textContent = 'システムを開いています。移動しない場合は下のボタンを押してください。';
    window.location.replace(APP_URL);
  }
}
</script>
</body>
</html>
